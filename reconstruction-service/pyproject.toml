[project]
name = "wt32-reconstruction-service"
version = "0.1.0"
description = "Vendor-neutral reconstruction job orchestration service for WT32"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.2",
  "uvicorn[standard]==0.34.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
